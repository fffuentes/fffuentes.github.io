<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avellana Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:20px;
    flex-wrap:wrap;
}

h1{
    color:#5a3e2b;
}

button{
    background:#c97e3a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    opacity:0.9;
    transform:translateY(-2px);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

canvas{
    width:100% !important;
    height:320px !important;
}

.status{
    margin-top:15px;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="top">

    <div>
        <h1>Avellana Dashboard</h1>
        <div class="status" id="statusText">
            Esperando actualización...
        </div>
    </div>

    <button id="btnActualizar">
        Actualizar Datos Excel
    </button>

</div>

<div class="grid">

    <div class="card">
        <h3>Ventas Mensuales</h3>
        <canvas id="ventasChart"></canvas>
    </div>

    <div class="card">
        <h3>Top Productos</h3>
        <canvas id="productosChart"></canvas>
    </div>

    <div class="card">
        <h3>Evolución Semanal</h3>
        <canvas id="semanalChart"></canvas>
    </div>

    <div class="card">
        <h3>Canales</h3>
        <canvas id="canalesChart"></canvas>
    </div>

</div>

</div>

<script>

// =====================================================
// CHARTS VACÍOS
// =====================================================

const ventasChart = new Chart(
    document.getElementById('ventasChart'),
    {
        type:'bar',
        data:{
            labels:[],
            datasets:[{
                label:'Ventas',
                data:[],
                backgroundColor:'#c97e3a'
            }]
        }
    }
);

const productosChart = new Chart(
    document.getElementById('productosChart'),
    {
        type:'doughnut',
        data:{
            labels:[],
            datasets:[{
                data:[
                ],
                backgroundColor:[
                    '#c97e3a',
                    '#e0a76a',
                    '#f2c185',
                    '#b36b33',
                    '#8a4f22'
                ]
            }]
        }
    }
);

const semanalChart = new Chart(
    document.getElementById('semanalChart'),
    {
        type:'line',
        data:{
            labels:[],
            datasets:[{
                label:'Ventas Semanales',
                data:[],
                borderColor:'#c97e3a',
                backgroundColor:'rgba(201,126,58,0.15)',
                fill:true,
                tension:0.3
            }]
        }
    }
);

const canalesChart = new Chart(
    document.getElementById('canalesChart'),
    {
        type:'bar',
        data:{
            labels:[],
            datasets:[{
                label:'Canales',
                data:[],
                backgroundColor:'#b36b33'
            }]
        },
        options:{
            indexAxis:'y'
        }
    }
);


// =====================================================
// FUNCIÓN PRINCIPAL
// =====================================================

async function cargarExcel(){

    try{

        document.getElementById('statusText')
            .innerText = 'Actualizando datos desde Excel...';

        // =====================================================
        // EVITAR CACHE
        // =====================================================

        const timestamp = new Date().getTime();

        const response = await fetch(
            `./avellana_data.xlsx?v=${timestamp}`,
            {
                cache:'no-store'
            }
        );

        if(!response.ok){

            throw new Error(
                'No se pudo descargar el Excel'
            );

        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer,{
                type:'array'
            });


        // =====================================================
        // VENTAS
        // =====================================================

        const ventasSheet =
            workbook.Sheets['VentasMensuales'];

        const ventasData =
            XLSX.utils.sheet_to_json(
                ventasSheet
            );

        ventasChart.data.labels =
            ventasData.map(x => x.Mes);

        ventasChart.data.datasets[0].data =
            ventasData.map(x => x.VentasK);

        ventasChart.update();


        // =====================================================
        // PRODUCTOS
        // =====================================================

        const productosSheet =
            workbook.Sheets['TopProductos'];

        const productosData =
            XLSX.utils.sheet_to_json(
                productosSheet
            );

        productosChart.data.labels =
            productosData.map(x => x.Producto);

        productosChart.data.datasets[0].data =
            productosData.map(x => x.VentasK);

        productosChart.update();


        // =====================================================
        // SEMANAL
        // =====================================================

        const semanalSheet =
            workbook.Sheets['VentasSemanales'];

        const semanalData =
            XLSX.utils.sheet_to_json(
                semanalSheet
            );

        semanalChart.data.labels =
            semanalData.map(x => x.Semana);

        semanalChart.data.datasets[0].data =
            semanalData.map(x => x.VentasK);

        semanalChart.update();


        // =====================================================
        // CANALES
        // =====================================================

        const canalesSheet =
            workbook.Sheets['CanalesVenta'];

        const canalesData =
            XLSX.utils.sheet_to_json(
                canalesSheet
            );

        canalesChart.data.labels =
            canalesData.map(x => x.Canal);

        canalesChart.data.datasets[0].data =
            canalesData.map(x => x.VentasK);

        canalesChart.update();


        // =====================================================
        // STATUS
        // =====================================================

        const hora =
            new Date().toLocaleTimeString();

        document.getElementById('statusText')
            .innerText =
            `Dashboard actualizado correctamente · ${hora}`;

        console.log(
            'Dashboard actualizado desde Excel'
        );

    }
    catch(error){

        console.error(error);

        document.getElementById('statusText')
            .innerText =
            'Error leyendo Excel';

        alert(
            'No se pudo leer el Excel. Verifica que avellana_data.xlsx esté en el mismo repositorio.'
        );

    }

}


// =====================================================
// BOTÓN ACTUALIZAR
// =====================================================

document
.getElementById('btnActualizar')
.addEventListener(
    'click',
    async () => {

        await cargarExcel();

    }
);


// =====================================================
// CARGA AUTOMÁTICA INICIAL
// =====================================================

window.addEventListener(
    'load',
    async () => {

        await cargarExcel();

    }
);

</script>

</body>
</html>
