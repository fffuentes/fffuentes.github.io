
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avellana Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

button{
    background:#c97e3a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<div class="top">
    <h1>Avellana Dashboard</h1>

    <button id="btnActualizar">
        Actualizar Datos
    </button>
</div>

<div class="grid">

<div class="card">
    <h3>Ventas Mensuales</h3>
    <canvas id="ventasChart"></canvas>
</div>

<div class="card">
    <h3>Top Productos</h3>
    <canvas id="productosChart"></canvas>
</div>

<div class="card">
    <h3>Evolución Semanal</h3>
    <canvas id="semanalChart"></canvas>
</div>

<div class="card">
    <h3>Canales</h3>
    <canvas id="canalesChart"></canvas>
</div>

</div>

</div>

<script>

// ===================================================
// YA NO HAY DATOS CONSTANTES
// TODO SE CARGA DESDE EL EXCEL
// ===================================================

// CHARTS VACÍOS

const ventasChart = new Chart(
    document.getElementById('ventasChart'),
    {
        type:'bar',
        data:{
            labels:[],
            datasets:[{
                label:'Ventas',
                data:[]
            }]
        }
    }
);

const productosChart = new Chart(
    document.getElementById('productosChart'),
    {
        type:'doughnut',
        data:{
            labels:[],
            datasets:[{
                data:[]
            }]
        }
    }
);

const semanalChart = new Chart(
    document.getElementById('semanalChart'),
    {
        type:'line',
        data:{
            labels:[],
            datasets:[{
                label:'Semanal',
                data:[]
            }]
        }
    }
);

const canalesChart = new Chart(
    document.getElementById('canalesChart'),
    {
        type:'bar',
        data:{
            labels:[],
            datasets:[{
                label:'Canales',
                data:[]
            }]
        },
        options:{
            indexAxis:'y'
        }
    }
);


// ===================================================
// LEER EXCEL
// ===================================================

async function cargarExcel(){

    try{

        const response =
            await fetch('./avellana_data.xlsx');

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer,{
                type:'array'
            });

        // ===========================================
        // VENTAS
        // ===========================================

        const ventasSheet =
            workbook.Sheets['VentasMensuales'];

        const ventasData =
            XLSX.utils.sheet_to_json(ventasSheet);

        ventasChart.data.labels =
            ventasData.map(x => x.Mes);

        ventasChart.data.datasets[0].data =
            ventasData.map(x => x.VentasK);

        ventasChart.update();

        // ===========================================
        // PRODUCTOS
        // ===========================================

        const productosSheet =
            workbook.Sheets['TopProductos'];

        const productosData =
            XLSX.utils.sheet_to_json(productosSheet);

        productosChart.data.labels =
            productosData.map(x => x.Producto);

        productosChart.data.datasets[0].data =
            productosData.map(x => x.VentasK);

        productosChart.update();

        // ===========================================
        // SEMANAL
        // ===========================================

        const semanalSheet =
            workbook.Sheets['VentasSemanales'];

        const semanalData =
            XLSX.utils.sheet_to_json(semanalSheet);

        semanalChart.data.labels =
            semanalData.map(x => x.Semana);

        semanalChart.data.datasets[0].data =
            semanalData.map(x => x.VentasK);

        semanalChart.update();

        // ===========================================
        // CANALES
        // ===========================================

        const canalesSheet =
            workbook.Sheets['CanalesVenta'];

        const canalesData =
            XLSX.utils.sheet_to_json(canalesSheet);

        canalesChart.data.labels =
            canalesData.map(x => x.Canal);

        canalesChart.data.datasets[0].data =
            canalesData.map(x => x.VentasK);

        canalesChart.update();

        console.log('Excel actualizado');

    }
    catch(error){

        console.error(error);

        alert(
            'No se pudo leer el Excel'
        );

    }

}


// ===================================================
// BOTÓN ACTUALIZAR
// ===================================================

document
.getElementById('btnActualizar')
.addEventListener(
    'click',
    cargarExcel
);


// ===================================================
// CARGA AUTOMÁTICA
// ===================================================

cargarExcel();

</script>

</body>
</html>
